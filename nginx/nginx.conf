server {
    listen 80;
    server_name _;

    client_max_body_size 25M;

    # Docker's embedded DNS — lets nginx re-resolve container IPs at runtime
    # (so rebuilding backend/frontend doesn't leave nginx pointing at a stale IP -> 502).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Backend API
    location /api/ {
        set $upstream_backend backend:4000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Swagger docs
    location /docs {
        set $upstream_backend backend:4000;
        proxy_pass http://$upstream_backend/docs;
        proxy_set_header Host $host;
    }

    # Frontend (Next.js)
    location / {
        set $upstream_frontend frontend:3000;
        proxy_pass http://$upstream_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
